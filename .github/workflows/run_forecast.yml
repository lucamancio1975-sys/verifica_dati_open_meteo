name: Run Giornaliera Previsioni Orarie Centraline Pomodoro

on:
  workflow_dispatch: # Attivato alle 07:00 da cron-job.org via GitHub REST API o manualmente da interfaccia GitHub
  schedule:
    - cron: '0 6 * * *' # Backup automatico GitHub Actions ogni mattina alle 06:00 UTC (07:00 ora solare italiana)

permissions:
  contents: write

concurrency:
  group: "open-meteo-pomodoro-forecast-run"
  cancel-in-progress: false

jobs:
  run-forecast:
    name: Download D+0, D+1, D+2 & Aggiornamento Archivio Orario in data/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione scarico previsioni orarie D+0, D+1, D+2 (6 centraline)
        run: |
          python run_forecast.py

      - name: Commit e Push automatico dei file CSV in data/
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "Nessuna nuova previsione o aggiornamento da salvare, nessun commit necessario."
          else
            git commit -m "🤖 Auto-update archivio orario data/ (D+0, D+1, D+2) da GitHub Actions"
            git pull --rebase origin main || true
            git push origin main
          fi
