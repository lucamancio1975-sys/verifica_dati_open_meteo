name: Run Giornaliera Previsioni Open-Meteo

on:
  workflow_dispatch: # Attivato da cron-job.org via GitHub REST API o manualmente da interfaccia GitHub

permissions:
  contents: write

concurrency:
  group: "open-meteo-forecast-run"
  cancel-in-progress: false

jobs:
  run-forecast:
    name: Download & Aggiornamento Database Previsioni
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione scarico previsioni (3 stazioni)
        run: |
          python run_forecast.py

      - name: Commit e Push automatico del database CSV
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add database/*.csv
          if git diff --staged --quiet; then
            echo "Nessuna nuova previsione da salvare, nessun commit necessario."
          else
            git commit -m "🤖 Auto-update database previsioni da GitHub Actions (Cron-Job Run)"
            git pull --rebase origin main || true
            git push origin main
          fi
